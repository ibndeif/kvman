name: Release

# Publishes to npm when a version tag is pushed (plan/adr/0026-npm-publishing.md).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag is the root version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Only the first release needs the token; after it, npm trusts this workflow and the secret is deleted.
      - name: Use the npm token when the secret is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
      - run: pnpm changeset publish
