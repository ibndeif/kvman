[package]
name = "kvman-desktop"
version = "0.4.2"
description = "The kvman desktop app: a shell that runs kvman and shows it in a window."
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "kvman_desktop"
path = "src/lib.rs"

[[bin]]
name = "kvman-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-opener = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-updater = "=2.13.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
